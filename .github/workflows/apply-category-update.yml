name: Apply FURKATOVICH category update
on:
  push:
    paths:
      - '.github/workflows/apply-category-update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update categories
        run: python3 scripts/update_categories.py
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Update FURKATOVICH categories"
          git push
