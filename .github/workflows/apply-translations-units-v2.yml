name: Apply translations and units v2
on:
  push:
    paths:
      - '.github/workflows/apply-translations-units-v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix_translations_units.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Fix remaining translations and localize units"
          git push
