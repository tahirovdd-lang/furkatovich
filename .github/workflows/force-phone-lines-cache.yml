name: Force phone lines and cache refresh
on:
  push:
    paths:
      - '.github/workflows/force-phone-lines-cache.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force phone layout and cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.brand-phone span{display:block;white-space:nowrap;}', '.brand-phone span{display:block !important;width:100%;white-space:nowrap;}\n    .brand-phone .phone-second{margin-top:3px;}')
          s=s.replace('<div class="brand-phone" id="brandPhone"><span>+998 (95) 560-88-81</span><span>+998 (93) 999-59-99</span></div>', '<div class="brand-phone" id="brandPhone"><div class="phone-first">+998 (95) 560-88-81</div><div class="phone-second">+998 (93) 999-59-99</div></div>')
          p.write_text(s,encoding='utf-8')
          bp=Path('bot.py')
          if bp.exists():
              b=bp.read_text(encoding='utf-8')
              b=b.replace('https://tahirovdd-lang.github.io/furkatovich/?v=1','https://tahirovdd-lang.github.io/furkatovich/?v=2')
              bp.write_text(b,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html bot.py
          git diff --cached --quiet || git commit -m "Force second phone onto separate line and bump WebApp version"
          git push
